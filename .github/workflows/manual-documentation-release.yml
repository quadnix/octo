name: Manual Documentation Release

on:
  workflow_dispatch:
    inputs:
      branch:
        default: 'main'
        description: 'Select the branch you want to build documentation from.'
        options:
          - main
        required: true
        type: choice
      autoApprove:
        default: false
        description: 'Allow this run to destroy resources.'
        type: boolean

concurrency:
  group: octo-docs-release
  cancel-in-progress: false

jobs:
  build-release:
    continue-on-error: false
    # Every value `apps/octo-docs/octo.yaml` declares under `env` is a default that a real value
    # overrides here. The two carrying an account id are secrets, because this repository is public.
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.AWS_CLOUDFRONT_CERTIFICATE_ARN }}
    name: Build & Release Documentation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup NPM
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/octo-docs/pnpm-lock.yaml
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          # The wrapper intercepts stdout, which Octo reads Terraform's JSON output from.
          terraform_wrapper: false
      - name: Setup Terragrunt
        run: |
          curl -sSL https://github.com/gruntwork-io/terragrunt/releases/download/v1.0.8/terragrunt_linux_amd64.tar.gz | tar -xz
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version
      - name: Setup AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: us-east-1
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Terraform authenticates from the ambient environment, which the step above sets, but Octo
      # does not: the definition names `AwsIniAccountModule`, which reads the `default` profile out
      # of the shared AWS files. `octo run-action` needs it too - Terraform shells back out to it
      # mid-apply to issue the CloudFront invalidation, and that second process resolves its own
      # credentials.
      - name: Setup AWS Profile
        run: |
          mkdir -p ~/.aws
          printf '[default]\nregion = us-east-1\n' > ~/.aws/config
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
      - name: Install Root Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Docs Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/octo-docs
      - name: Plugin Pre Script
        run: pnpm run plugin:pre-script
        working-directory: apps/octo-docs
      - name: Build Plugin
        run: pnpm run plugin:build
        working-directory: apps/octo-docs
      - name: Build Docs
        run: pnpm run build
        working-directory: apps/octo-docs
      - name: Plugin Post Script
        run: pnpm run plugin:post-script
        working-directory: apps/octo-docs

      - name: Generate
        run: pnpm run octo:generate
        working-directory: apps/octo-docs

      - name: Validate
        run: pnpm run octo:validate
        working-directory: apps/octo-docs

      - id: lock
        name: Lock
        run: |
          LOCK_ID=$(pnpm run --silent octo:lock | tail -n 1 | tr -d '[:space:]')
          if [ -z "$LOCK_ID" ]; then
            echo "octo lock returned no lock id."
            exit 1
          fi
          echo "LOCK_ID=$LOCK_ID" >> "$GITHUB_ENV"
        working-directory: apps/octo-docs

      - continue-on-error: true
        env:
          AUTO_APPROVE: ${{ github.event.inputs.autoApprove }}
        id: apply
        name: Apply
        run: |
          if [ "$AUTO_APPROVE" = "true" ]; then
            pnpm run octo:apply --lockId "$LOCK_ID" --auto-approve
          else
            pnpm run octo:apply --lockId "$LOCK_ID"
          fi
        working-directory: apps/octo-docs

      - if: ${{ !cancelled() && steps.lock.outcome == 'success' }}
        name: Commit
        run: |
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            pnpm run octo:commit --lockId "$LOCK_ID"
          else
            pnpm run octo:commit --lockId "$LOCK_ID" --partial
          fi
        working-directory: apps/octo-docs

      - if: ${{ !cancelled() }}
        name: Push the state commit
        run: |
          if [ -z "$(git status --porcelain apps/octo-docs/.octo)" ]; then
            echo "No state changes to push."
            exit 0
          fi

          git add apps/octo-docs/.octo
          git commit --no-verify -m "chore(release): octo-docs | octo state."

          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.event.inputs.branch }} \
              && git push origin HEAD:${{ github.event.inputs.branch }} \
              && exit 0
            echo "Branch moved while pushing, retry $attempt"
          done

          echo "Could not push the state commit."
          exit 1

      - if: steps.apply.outcome != 'success'
        name: Fail the run if apply failed
        run: exit 1
