version: 1

terraform:
  requiredVersion: '1.6.0'
  requiredProviders: {}
  providers: []

imports:
  - className: 'SomeModule'
    importPath: './some-module.js'

modules:
  - moduleClass: 'SomeModule'
    moduleId: 'app'
    moduleInputs: {}

settings:
  stateProvider:
    type: 'RemoteStateProvider'
    stateManagementServiceUrl: 'http://localhost:3619/state'
    organizationId: 'an-organization'
    appId: 'an-app'
    sessionId: 'a-session'
    statePath: '.octo'
    checkInIntervalInSeconds: 30
