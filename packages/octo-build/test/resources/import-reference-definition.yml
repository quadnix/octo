version: 1

env:
  - key: OCTO_TEST_NAME
    kind: string
    value: 'website'

terraform:
  requiredVersion: '1.6.0'
  requiredProviders: {}
  providers: []

imports:
  - className: 'Octo'
    importPath: '@quadnix/octo'

modules:
  - moduleClass: 'Octo'
    moduleId: 'app'
    moduleInputs:
      filter: "${import ./import-reference/upload.js#skipSourceMaps}"
      nested:
        - name: "${env.OCTO_TEST_NAME}"
          transform: "${import ./import-reference/upload.js#skipSourceMaps}"

settings:
  stateProvider:
    type: 'TestStateProvider'
