# yaml-language-server: $schema=../../../octo-build/src/resources/octo-v1.schema.json

# An API on Lambda, served to the internet through CloudFront. One container image, published into
# ECR, runs as three functions in a serverless region:
# - the greeter, on the default route, which also calls the private function on `/private`;
# - the streamer, on `/stream/*`, which streams a response past Lambda's 6 MB buffered limit;
# - the private function, not behind CloudFront, whose URL admits no one by its own policy. Only the
#   greeter's server reaches it, by the IAM statements it grants.
# Servers and deployments create nothing: each execution creates its function's role, the function,
# and its URL, which only signed requests may call.

version: 1

env:
  - key: AWS_ACCOUNT_ID
    kind: string
    value: '123456789123'
  - key: AWS_IMAGE_NAME
    kind: string
    value: 'octo-lambda-api-template'
  - key: GREETING
    kind: string
    value: 'hello'
  # The private function's ARN, which the greeter's server names because octo does not reach it from
  # there. Its name is its execution's id.
  - key: PRIVATE_FUNCTION_ARN
    kind: string
    value: 'arn:aws:lambda:us-east-1:123456789123:function:octo-lambda-api-private'

settings:
  listeners:
    - type: JournalEventListener
    - type: LoggingEventListener
      level: info

  stateProvider:
    type: LocalStateProvider
    statePath: .octo/state

imports:
  - className: SimpleAppModule
    importPath: '@quadnix/octo-aws-cdk/modules/app/simple-app'
  - className: AwsIniAccountModule
    importPath: '@quadnix/octo-aws-cdk/modules/account/aws-ini-account'
  - className: AwsServerlessRegionModule
    importPath: '@quadnix/octo-aws-cdk/modules/region/aws-serverless-region'
  - className: AwsEcrImageModule
    importPath: '@quadnix/octo-aws-cdk/modules/image/aws-ecr-image'
  - className: AwsEcrImageTagModule
    importPath: '@quadnix/octo-aws-cdk/modules/image/aws-ecr-image-tag'
  - className: AwsServerlessEnvironmentModule
    importPath: '@quadnix/octo-aws-cdk/modules/environment/aws-serverless-environment'
  - className: AwsServerlessSubnetModule
    importPath: '@quadnix/octo-aws-cdk/modules/subnet/aws-serverless-subnet'
  - className: AwsServerModule
    importPath: '@quadnix/octo-aws-cdk/modules/server/aws-server'
  - className: AwsDeploymentModule
    importPath: '@quadnix/octo-aws-cdk/modules/deployment/aws-deployment'
  - className: AwsLambdaExecutionModule
    importPath: '@quadnix/octo-aws-cdk/modules/execution/aws-lambda-execution'
  - className: AwsCloudFrontServiceModule
    importPath: '@quadnix/octo-aws-cdk/modules/service/aws-cloudfront-service'

modules:
  - moduleId: app-module
    moduleClass: SimpleAppModule
    moduleInputs:
      name: aws-lambda-api

  - moduleId: account-module
    moduleClass: AwsIniAccountModule
    moduleInputs:
      accountId: '${env.AWS_ACCOUNT_ID}'
      app: '${{app-module.model.app}}'
      iniProfile: default

  - moduleId: region-module
    moduleClass: AwsServerlessRegionModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      name: lambda-region
      regionId: aws-us-east-1

  - moduleId: image-module
    moduleClass: AwsEcrImageModule
    moduleInputs:
      imageFamily: quadnix
      imageName: '${env.AWS_IMAGE_NAME}'
      regions:
        - '${{region-module.model.region}}'

  # Built for arm64, the processor the function runs on, on whatever machine runs the build.
  - moduleId: image-tag-module
    moduleClass: AwsEcrImageTagModule
    moduleInputs:
      architecture: arm64
      dockerfileDirectory: function
      dockerfileName: Dockerfile
      image: '${{image-module.model.image}}'
      imageTag: '0.0.1'

  - moduleId: environment-module
    moduleClass: AwsServerlessEnvironmentModule
    moduleInputs:
      environmentName: qa
      environmentVariables:
        GREETING: '${env.GREETING}'
      region: '${{region-module.model.region}}'

  - moduleId: subnet-module
    moduleClass: AwsServerlessSubnetModule
    moduleInputs:
      region: '${{region-module.model.region}}'

  - moduleId: greeter-server-module
    moduleClass: AwsServerModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      iamStatements:
        - actions: ['lambda:GetFunctionUrlConfig']
          resources: ['${env.PRIVATE_FUNCTION_ARN}']
        - actions: ['lambda:InvokeFunction', 'lambda:InvokeFunctionUrl']
          resources: ['${env.PRIVATE_FUNCTION_ARN}']
      serverKey: greeter

  - moduleId: private-server-module
    moduleClass: AwsServerModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      serverKey: private

  - moduleId: streamer-server-module
    moduleClass: AwsServerModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      serverKey: streamer

  - moduleId: greeter-deployment-module
    moduleClass: AwsDeploymentModule
    moduleInputs:
      command: [node, greeter.mjs]
      deploymentTag: v1
      image: '${{image-module.model.image}}'
      imageTag: '0.0.1'
      memory: 512
      ports:
        - containerPort: 8080
          protocol: tcp
      server: '${{greeter-server-module.model.server}}'
      timeoutInSeconds: 30

  - moduleId: private-deployment-module
    moduleClass: AwsDeploymentModule
    moduleInputs:
      command: [node, private.mjs]
      deploymentTag: v1
      image: '${{image-module.model.image}}'
      imageTag: '0.0.1'
      memory: 512
      ports:
        - containerPort: 8080
          protocol: tcp
      server: '${{private-server-module.model.server}}'
      timeoutInSeconds: 30

  - moduleId: streamer-deployment-module
    moduleClass: AwsDeploymentModule
    moduleInputs:
      command: [node, streamer.mjs]
      deploymentTag: v1
      image: '${{image-module.model.image}}'
      imageTag: '0.0.1'
      memory: 512
      ports:
        - containerPort: 8080
          protocol: tcp
      server: '${{streamer-server-module.model.server}}'
      timeoutInSeconds: 30

  # An execution id is its function's name, and part of its role's, both of which are unique per
  # account. Each is scoped to this template so that no other stack is refused the name.
  - moduleId: greeter-execution-module
    moduleClass: AwsLambdaExecutionModule
    moduleInputs:
      deployment: '${{greeter-deployment-module.model.deployment}}'
      environment: '${{environment-module.model.environment}}'
      environmentVariables:
        PRIVATE_FUNCTION_NAME: octo-lambda-api-private
      executionId: octo-lambda-api-greeter
      subnet: '${{subnet-module.model.subnet}}'

  - moduleId: private-execution-module
    moduleClass: AwsLambdaExecutionModule
    moduleInputs:
      deployment: '${{private-deployment-module.model.deployment}}'
      environment: '${{environment-module.model.environment}}'
      executionId: octo-lambda-api-private
      subnet: '${{subnet-module.model.subnet}}'

  - moduleId: streamer-execution-module
    moduleClass: AwsLambdaExecutionModule
    moduleInputs:
      deployment: '${{streamer-deployment-module.model.deployment}}'
      environment: '${{environment-module.model.environment}}'
      environmentVariables:
        STREAM_MEGABYTES: '8'
      executionId: octo-lambda-api-streamer
      invokeMode: RESPONSE_STREAM
      subnet: '${{subnet-module.model.subnet}}'

  - moduleId: distribution-module
    moduleClass: AwsCloudFrontServiceModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      distributionName: octo-lambda-api-template
      origins:
        - originId: greeter
          source: '${{greeter-execution-module.model.execution}}'
        - originId: streamer
          source: '${{streamer-execution-module.model.execution}}'
      priceClass: PriceClass_100
      routes:
        - originId: streamer
          pathPattern: '/stream/*'
        - originId: greeter

tags:
  - scope: {}
    tags:
      e2e-test: 'true'
      e2e-test-family: aws-lambda-api

terraform:
  requiredVersion: '1.6.0'
  requiredProviders:
    aws:
      source: hashicorp/aws
      # A function URL's permissions need invoked_via_function_url, first in 6.28.0.
      minVersion: '6.28.0'
  providers:
    - providerType: aws
      accountId: '${env.AWS_ACCOUNT_ID}'
      regionId: us-east-1
