# yaml-language-server: $schema=../../../octo-build/src/resources/octo-v1.schema.json

version: 1

env:
  - key: AWS_ACCOUNT_ID
    kind: string
    value: '123456789123'
  - key: AWS_CLOUDFRONT_WEBSITE_BUCKET_NAME
    kind: string
    value: 'my-website-unique-bucket'

settings:
  listeners:
    - type: JournalEventListener
    - type: LoggingEventListener
      level: info

  stateProvider:
    type: LocalStateProvider
    statePath: .octo/state

imports:
  - className: SimpleAppModule
    importPath: '@quadnix/octo-aws-cdk/modules/app/simple-app'
  - className: AwsIniAccountModule
    importPath: '@quadnix/octo-aws-cdk/modules/account/aws-ini-account'
  - className: AwsServerlessRegionModule
    importPath: '@quadnix/octo-aws-cdk/modules/region/aws-serverless-region'
  - className: AwsS3StorageServiceModule
    importPath: '@quadnix/octo-aws-cdk/modules/service/aws-s3-storage-service'
  - className: AwsCloudFrontServiceModule
    importPath: '@quadnix/octo-aws-cdk/modules/service/aws-cloudfront-service'
  - className: AwsCloudFrontInvalidationServiceModule
    importPath: '@quadnix/octo-aws-cdk/modules/service/aws-cloudfront-invalidation-service'

modules:
  - moduleId: app-module
    moduleClass: SimpleAppModule
    moduleInputs:
      name: aws-cloudfront-website

  - moduleId: account-module
    moduleClass: AwsIniAccountModule
    moduleInputs:
      accountId: '${env.AWS_ACCOUNT_ID}'
      app: '${{app-module.model.app}}'
      iniProfile: default

  - moduleId: region-module
    moduleClass: AwsServerlessRegionModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      name: aws-cloudfront-website
      regionId: aws-us-east-1

  # The website's files, in a closed bucket: the distribution below is the only way in.
  #
  # The bucket name carries no dot, because the distribution reaches the bucket over HTTPS at
  # `<bucket>.s3.<region>.amazonaws.com` and AWS's certificate covers one label there.
  - moduleId: website-storage-module
    moduleClass: AwsS3StorageServiceModule
    moduleInputs:
      bucketName: '${env.AWS_CLOUDFRONT_WEBSITE_BUCKET_NAME}'
      directoryPath: website
      region: '${{region-module.model.region}}'

  # The distribution serving the bucket. A missing page answers a real 404 carrying the site's error
  # document; the closed bucket reports a missing object as 403.
  - moduleId: website-cloudfront-module
    moduleClass: AwsCloudFrontServiceModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      defaultRootObject: index.html
      distributionName: aws-cloudfront-website
      errorResponses:
        - errorCode: 403
          responseCode: 404
          responsePagePath: /error.html
        - errorCode: 404
          responseCode: 404
          responsePagePath: /error.html
      origins:
        - originId: website
          source: '${{website-storage-module.model.service}}'
      priceClass: PriceClass_100
      routes:
        - originId: website

  # Drops what the edge locations hold every time the bucket's files change.
  - moduleId: website-invalidation-module
    moduleClass: AwsCloudFrontInvalidationServiceModule
    moduleInputs:
      cloudFront: '${{website-cloudfront-module.model.service}}'
      source: '${{website-storage-module.model.service}}'

tags:
  - scope: {}
    tags:
      e2e-test: 'true'
      e2e-test-family: aws-cloudfront-website

terraform:
  requiredVersion: '1.6.0'
  requiredProviders:
    aws:
      source: hashicorp/aws
      minVersion: '5.0.0'
  providers:
    - providerType: aws
      accountId: '${env.AWS_ACCOUNT_ID}'
      regionId: us-east-1
