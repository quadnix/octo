# yaml-language-server: $schema=../../../octo-build/src/resources/octo-v1.schema.json

# A static website served straight from an S3 bucket's website endpoint, over plain HTTP. The bucket
# holds the files in `website`. For HTTPS and edge caching, see `aws-cloudfront-website`.

version: 1

env:
  - key: AWS_ACCOUNT_ID
    kind: string
    value: '123456789123'
  - key: AWS_S3_WEBSITE_BUCKET_NAME
    kind: string
    value: 'my-website-unique-bucket'

settings:
  listeners:
    - type: JournalEventListener
    - type: LoggingEventListener
      level: info

  stateProvider:
    type: LocalStateProvider
    statePath: .octo/state

imports:
  - className: SimpleAppModule
    importPath: '@quadnix/octo-aws-cdk/modules/app/simple-app'
  - className: AwsIniAccountModule
    importPath: '@quadnix/octo-aws-cdk/modules/account/aws-ini-account'
  - className: AwsServerlessRegionModule
    importPath: '@quadnix/octo-aws-cdk/modules/region/aws-serverless-region'
  - className: AwsS3StaticWebsiteServiceModule
    importPath: '@quadnix/octo-aws-cdk/modules/service/aws-s3-static-website-service'

modules:
  - moduleId: app-module
    moduleClass: SimpleAppModule
    moduleInputs:
      name: aws-s3-website

  - moduleId: account-module
    moduleClass: AwsIniAccountModule
    moduleInputs:
      accountId: '${env.AWS_ACCOUNT_ID}'
      app: '${{app-module.model.app}}'
      iniProfile: default

  - moduleId: region-module
    moduleClass: AwsServerlessRegionModule
    moduleInputs:
      account: '${{account-module.model.account}}'
      name: aws-s3-website
      regionId: aws-us-east-1

  - moduleId: s3-website-service-module
    moduleClass: AwsS3StaticWebsiteServiceModule
    moduleInputs:
      bucketName: '${env.AWS_S3_WEBSITE_BUCKET_NAME}'
      directoryPath: website
      region: '${{region-module.model.region}}'

tags:
  - scope: {}
    tags:
      e2e-test: 'true'
      e2e-test-family: aws-s3-website

terraform:
  requiredVersion: '1.6.0'
  requiredProviders:
    aws:
      source: hashicorp/aws
      minVersion: '5.0.0'
  providers:
    - providerType: aws
      accountId: '${env.AWS_ACCOUNT_ID}'
      regionId: us-east-1
